name: Publish frames image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-frames
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/wevm/nethermind-frames

jobs:
  build:
    if: github.repository == 'wevm/nethermind'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Read source timestamp
        id: source
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          labels: |
            org.opencontainers.image.source=https://github.com/wevm/nethermind
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Nethermind EIP-8141 frame transaction development build
            org.opencontainers.image.licenses=LGPL-3.0-only
          cache-from: type=gha,scope=frames-${{ matrix.arch }}
          cache-to: type=gha,scope=frames-${{ matrix.arch }},mode=max

      - name: Verify image starts
        env:
          TAG: ${{ github.sha }}-${{ matrix.arch }}
        run: docker run --rm "$IMAGE:$TAG" --version

      - name: Push architecture image
        env:
          TAG: ${{ github.sha }}-${{ matrix.arch }}
        run: docker push "$IMAGE:$TAG"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform tags
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$REVISION" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$REVISION-amd64" \
            "$IMAGE:$REVISION-arm64"
          docker buildx imagetools inspect "$IMAGE:$REVISION"
          {
            echo '## Published frames image'
            echo
            echo "\`$IMAGE:$REVISION\`"
            echo
            echo 'Platforms: linux/amd64 and linux/arm64. Both passed --version smoke checks.'
          } >> "$GITHUB_STEP_SUMMARY"
